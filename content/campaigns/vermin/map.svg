  <path d="M 320 100 Q 200 38 80 100" fill="none" stroke="#5b1b1b" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.58"/>
  <path d="M 460 100 L 440 260" fill="none" stroke="#9e2828" stroke-width="2.6" opacity="0.85"/>
  <path d="M 440 260 L 290 260 L 160 360 Q 300 320 440 260" fill="none" stroke="#9e2828" stroke-width="2.3" opacity="0.8"/>
  <path d="M 440 260 L 560 260 L 630 360 L 630 185" fill="none" stroke="#7c2222" stroke-width="2.1" opacity="0.7"/>
  <path d="M 630 360 L 590 455 L 480 455 L 440 260" fill="none" stroke="#9e2828" stroke-width="2.3" opacity="0.78"/>
  <path d="M 440 260 L 440 380 L 350 480 Q 400 370 440 260" fill="none" stroke="#c42222" stroke-width="2.6" opacity="0.88"/>
  <path d="M 440 260 L 285 395" fill="none" stroke="#d49a37" stroke-width="2.6" opacity="0.85"/>
  <path d="M 285 395 L 165 475 L 80 555" fill="none" stroke="#7b5698" stroke-width="2.2" opacity="0.78"/>
  <path d="M 285 395 L 185 575" fill="none" stroke="#a62c2c" stroke-width="2.2" opacity="0.78"/>
  <path d="M 285 395 L 360 540 L 480 540 L 590 540" fill="none" stroke="#d62828" stroke-width="3" opacity="0.9"/>
  <path d="M 590 540 Q 674 300 400 36 Q 200 18 80 100" fill="none" stroke="#662020" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.52"/>

  <!-- Location Room Blueprint Nodes -->
  <rect x="68" y="88" width="24" height="24" rx="2" fill="#2d1515" stroke="#e83a3a" stroke-width="2"/>
  <circle cx="200" cy="100" r="10" fill="#281313" stroke="#c41e1e" stroke-width="1.5"/>
  <circle cx="320" cy="100" r="11" fill="#3a1515" stroke="#c41e1e" stroke-width="1.5"/>
  <circle cx="460" cy="100" r="10" fill="#281313" stroke="#c41e1e" stroke-width="1.5"/>
  <circle cx="575" cy="80" r="9" fill="#281313" stroke="#a52828" stroke-width="1.4"/>

  <rect x="424" y="244" width="32" height="32" rx="3" fill="#4a1515" stroke="#e83a3a" stroke-width="2.2" filter="url(#vb-glow)"/>
  <circle cx="290" cy="260" r="12" fill="#2d1515" stroke="#c41e1e" stroke-width="1.6"/>
  <circle cx="160" cy="360" r="12" fill="#2d1515" stroke="#c41e1e" stroke-width="1.6"/>

  <circle cx="560" cy="260" r="10" fill="#241515" stroke="#962828" stroke-width="1.4"/>
  <circle cx="630" cy="360" r="10" fill="#241515" stroke="#962828" stroke-width="1.4"/>
  <circle cx="630" cy="185" r="9" fill="#241515" stroke="#722020" stroke-width="1.4"/>
  <circle cx="590" cy="455" r="10" fill="#241515" stroke="#962828" stroke-width="1.4"/>
  <circle cx="480" cy="455" r="10" fill="#241515" stroke="#962828" stroke-width="1.4"/>

  <circle cx="440" cy="380" r="13" fill="#4a0f0f" stroke="#e83a3a" stroke-width="1.8"/>
  <circle cx="350" cy="480" r="13" fill="#4a0f0f" stroke="#e83a3a" stroke-width="1.8"/>

  <circle cx="285" cy="395" r="14" fill="#2d3015" stroke="#d49a37" stroke-width="2.1"/>
  <circle cx="165" cy="475" r="12" fill="#24202d" stroke="#7c5aa0" stroke-width="1.6"/>
  <circle cx="80" cy="555" r="11" fill="#24202d" stroke="#7c5aa0" stroke-width="1.5"/>
  <circle cx="185" cy="575" r="12" fill="#3a1515" stroke="#c41e1e" stroke-width="1.6"/>
  <circle cx="360" cy="540" r="12" fill="#1f1b2b" stroke="#9668aa" stroke-width="1.6"/>

  <circle cx="480" cy="540" r="14" fill="#0d0a14" stroke="#8a4a8a" stroke-width="2"/>
  <rect x="572" y="522" width="36" height="36" rx="3" fill="#3d0a0a" stroke="#e83a3a" stroke-width="2.5" filter="url(#vb-glow)"/>

  <!-- Architectural Labels -->
  <g font-family="'Cinzel', Georgia, serif" font-size="10.5" fill="#d8cec6" opacity="0.88" text-anchor="middle">
