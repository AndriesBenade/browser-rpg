    <text x="200" y="81">Projector</text>
    <text x="320" y="81">The Rag</text>
    <text x="460" y="81">Hallway</text>
    <text x="575" y="64">Music Box</text>

    <text x="440" y="234" font-weight="bold" fill="#ff5454">IX · VIII · VII (Antechamber)</text>
    <text x="290" y="241">Kitchen</text>
    <text x="160" y="341">Dining Hall</text>

    <text x="560" y="244">Maze Entry</text>
    <text x="630" y="381">Corridor</text>
    <text x="630" y="170">Dead End</text>
    <text x="590" y="476">Zig-Zag</text>
    <text x="480" y="476">Exit Chamber</text>

    <text x="440" y="405" fill="#ff5454">Visceral Room</text>
    <text x="350" y="505" fill="#ff5454">Dissection</text>

    <text x="285" y="374" fill="#e5b14e">Green Armchair</text>
    <text x="165" y="496">Clinic Lobby</text>
    <text x="80" y="538">Archives</text>
    <text x="185" y="596">Bathtub</text>
    <text x="360" y="566">Mirrors</text>

    <text x="480" y="567">The Void</text>
    <text x="590" y="514" font-weight="bold" fill="#ff5454">The Final Verdict</text>
  </g>
</svg>
