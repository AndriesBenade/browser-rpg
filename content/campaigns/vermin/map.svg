<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
  <defs>
    <radialGradient id="vb-void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#140a0a"/>
      <stop offset="50%" stop-color="#0a0505"/>
      <stop offset="100%" stop-color="#030202"/>
    </radialGradient>
    <filter id="vb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background Void -->
  <rect x="0" y="0" width="700" height="600" fill="url(#vb-void)"/>

  <!-- Shifting Floor Grid -->
  <g stroke="#2a1212" stroke-width="0.8" opacity="0.4">
    <line x1="50" y1="50" x2="650" y2="50"/>
    <line x1="50" y1="150" x2="650" y2="150"/>
    <line x1="50" y1="250" x2="650" y2="250"/>
    <line x1="50" y1="350" x2="650" y2="350"/>
    <line x1="50" y1="450" x2="650" y2="450"/>
    <line x1="50" y1="550" x2="650" y2="550"/>

    <line x1="70" y1="50" x2="70" y2="550"/>
    <line x1="170" y1="50" x2="170" y2="550"/>
    <line x1="270" y1="50" x2="270" y2="550"/>
    <line x1="370" y1="50" x2="370" y2="550"/>
    <line x1="470" y1="50" x2="470" y2="550"/>
    <line x1="570" y1="50" x2="570" y2="550"/>
  </g>

  <!-- Architectural Corridors -->
  <!-- Loop: Waking (80,100) -> Projector (200,100) -> Rag (320,100) -> Hallway (460,100) -> Music Box (575,80) -->
  <path d="M 80 100 L 200 100 L 320 100 L 460 100 L 575 80" fill="none" stroke="#6b1d1d" stroke-width="3" opacity="0.7"/>
  <!-- Loop return from Rag (320,100) back to Waking (80,100) -->
  <path d="M 320 100 Q 200 40 80 100" fill="none" stroke="#4a1515" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- From Hallway (460,100) to Antechamber (440,260) -->
  <path d="M 460 100 L 440 260" fill="none" stroke="#8c2323" stroke-width="2.5" opacity="0.8"/>

  <!-- Antechamber to Kitchen (290,260) -> Dining (160,360) -> back to Antechamber (440,260) -->
  <path d="M 440 260 L 290 260 L 160 360 Q 300 320 440 260" fill="none" stroke="#8c2323" stroke-width="2.2" opacity="0.75"/>

  <!-- Antechamber to Maze Entry (560,260) -> Corridor (630,360) -> Dead End (630,185) & Zig Zag (590,455) -> Chamber (480,455) -> Antechamber (440,260) -->
  <path d="M 440 260 L 560 260 L 630 360 L 630 185" fill="none" stroke="#6b1d1d" stroke-width="2" opacity="0.6"/>
  <path d="M 630 360 L 590 455 L 480 455 L 440 260" fill="none" stroke="#8c2323" stroke-width="2.2" opacity="0.7"/>

  <!-- Antechamber to Gut Room (440,380) -> Expanded (350,480) -> Antechamber (440,260) -->
  <path d="M 440 260 L 440 380 L 350 480 Q 400 370 440 260" fill="none" stroke="#b31e1e" stroke-width="2.5" opacity="0.85"/>

  <!-- Antechamber to Green Chair (285,395) -->
  <path d="M 440 260 L 285 395" fill="none" stroke="#d49a37" stroke-width="2.5" opacity="0.8"/>

  <!-- Green Chair (285,395) to Lobby (165,475) -> Filing (80,555) -->
  <path d="M 285 395 L 165 475 L 80 555" fill="none" stroke="#6b1d1d" stroke-width="2" opacity="0.7"/>

  <!-- Green Chair (285,395) to Bathtub (185,575) -->
  <path d="M 285 395 L 185 575" fill="none" stroke="#8c2323" stroke-width="2" opacity="0.7"/>

  <!-- Green Chair (285,395) to Mirror Hall (360,540) -> The Void (480,540) -> Judgment Hall (590,540) -->
  <path d="M 285 395 L 360 540 L 480 540 L 590 540" fill="none" stroke="#c41e1e" stroke-width="3" opacity="0.85"/>
  <!-- Judgment Hall (590,540) looping back to Waking Room (80,100) -->
  <path d="M 590 540 Q 670 300 400 40 Q 200 20 80 100" fill="none" stroke="#5a1818" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.5"/>

  <!-- Location Room Nodes -->
  <!-- Loop Zone -->
  <rect x="68" y="88" width="24" height="24" fill="#2d1515" stroke="#e83a3a" stroke-width="1.8"/>
  <circle cx="200" cy="100" r="10" fill="#2d1515" stroke="#c41e1e" stroke-width="1.5"/>
  <circle cx="320" cy="100" r="11" fill="#3a1515" stroke="#c41e1e" stroke-width="1.5"/>
  <circle cx="460" cy="100" r="10" fill="#2d1515" stroke="#c41e1e" stroke-width="1.5"/>
  <circle cx="575" cy="80" r="9" fill="#2d1515" stroke="#992222" stroke-width="1.4"/>

  <!-- Countdown Hub -->
  <rect x="424" y="244" width="32" height="32" fill="#4a1515" stroke="#e83a3a" stroke-width="2.2" filter="url(#vb-glow)"/>
  <circle cx="290" cy="260" r="12" fill="#2d1515" stroke="#c41e1e" stroke-width="1.6"/>
  <circle cx="160" cy="360" r="12" fill="#2d1515" stroke="#c41e1e" stroke-width="1.6"/>

  <!-- Labyrinth -->
  <circle cx="560" cy="260" r="10" fill="#241515" stroke="#8c2323" stroke-width="1.4"/>
  <circle cx="630" cy="360" r="10" fill="#241515" stroke="#8c2323" stroke-width="1.4"/>
  <circle cx="630" cy="185" r="9" fill="#241515" stroke="#6b1d1d" stroke-width="1.4"/>
  <circle cx="590" cy="455" r="10" fill="#241515" stroke="#8c2323" stroke-width="1.4"/>
  <circle cx="480" cy="455" r="10" fill="#241515" stroke="#8c2323" stroke-width="1.4"/>

  <!-- Visceral Rooms -->
  <circle cx="440" cy="380" r="13" fill="#4a0f0f" stroke="#e83a3a" stroke-width="1.8"/>
  <circle cx="350" cy="480" r="13" fill="#4a0f0f" stroke="#e83a3a" stroke-width="1.8"/>

  <!-- Memory & Clinical -->
  <circle cx="285" cy="395" r="14" fill="#2d3015" stroke="#d49a37" stroke-width="2"/>
  <circle cx="165" cy="475" r="12" fill="#24202d" stroke="#6a4a8a" stroke-width="1.6"/>
  <circle cx="80" cy="555" r="11" fill="#24202d" stroke="#6a4a8a" stroke-width="1.5"/>
  <circle cx="185" cy="575" r="12" fill="#3a1515" stroke="#c41e1e" stroke-width="1.6"/>
  <circle cx="360" cy="540" r="12" fill="#1f1b2b" stroke="#8a5a9a" stroke-width="1.6"/>

  <!-- End Game Abyss -->
  <circle cx="480" cy="540" r="14" fill="#0d0a14" stroke="#8a4a8a" stroke-width="2"/>
  <rect x="572" y="522" width="36" height="36" fill="#3d0a0a" stroke="#e83a3a" stroke-width="2.5" filter="url(#vb-glow)"/>

  <!-- Labels -->
  <g font-family="'Cinzel', Georgia, serif" font-size="11" fill="#c8c0b8" opacity="0.85" text-anchor="middle">
    <text x="80" y="74">Waking Room</text>
    <text x="200" y="80">Projector</text>
    <text x="320" y="80">The Rag</text>
    <text x="460" y="80">Hallway</text>
    <text x="575" y="62">Music Box</text>

    <text x="440" y="235" font-weight="bold" fill="#e83a3a">IX · VIII · VII (Antechamber)</text>
    <text x="290" y="242">Kitchen</text>
    <text x="160" y="342">Dining Hall</text>

    <text x="560" y="245">Maze Entry</text>
    <text x="630" y="380">Corridor</text>
    <text x="630" y="170">Dead End</text>
    <text x="590" y="475">Zig-Zag</text>
    <text x="480" y="475">Exit Chamber</text>

    <text x="440" y="405" fill="#e83a3a">Visceral Room</text>
    <text x="350" y="505" fill="#e83a3a">Dissection</text>

    <text x="285" y="375" fill="#d49a37">Green Armchair</text>
    <text x="165" y="495">Clinic Lobby</text>
    <text x="80" y="540">Archives</text>
    <text x="185" y="595">Bathtub</text>
    <text x="360" y="565">Mirrors</text>

    <text x="480" y="565">The Void</text>
    <text x="590" y="515" font-weight="bold" fill="#e83a3a">The Final Verdict</text>
  </g>
</svg>
