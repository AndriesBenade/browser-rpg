  <circle cx="285" cy="395" r="52" fill="url(#vb-amber-halo)"/>
  <circle cx="590" cy="540" r="56" fill="url(#vb-crimson-halo)"/>

  <!-- Zone Titles -->
  <g font-family="Georgia, serif" font-size="9.5" letter-spacing="2" fill="#8b4d4d" opacity="0.72">
