    <text x="534" y="170">II. LABYRINTH</text>
    <text x="54" y="382" fill="#7f5c9c">III. MEMORY CORRIDORS</text>
    <text x="452" y="516" fill="#b33030">IV. THE FINAL ACCOUNTING</text>
