<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600">
  <defs>
    <radialGradient id="vb-void" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#170b0c"/>
      <stop offset="55%" stop-color="#0a0506"/>
      <stop offset="100%" stop-color="#030203"/>
    </radialGradient>
    <radialGradient id="vb-crimson-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c41e1e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c41e1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vb-amber-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d49a37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d49a37" stop-opacity="0"/>
    </radialGradient>
    <filter id="vb-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Void -->
  <rect x="0" y="0" width="700" height="600" fill="url(#vb-void)"/>

  <!-- Subtle Architectural Blueprint Grid -->
  <g stroke="#2a1214" stroke-width="0.6" opacity="0.35">
    <line x1="35" y1="50" x2="665" y2="50"/>
    <line x1="35" y1="150" x2="665" y2="150"/>
    <line x1="35" y1="250" x2="665" y2="250"/>
    <line x1="35" y1="350" x2="665" y2="350"/>
    <line x1="35" y1="450" x2="665" y2="450"/>
    <line x1="35" y1="550" x2="665" y2="550"/>
    <line x1="70" y1="30" x2="70" y2="575"/>
    <line x1="170" y1="30" x2="170" y2="575"/>
    <line x1="270" y1="30" x2="270" y2="575"/>
    <line x1="370" y1="30" x2="370" y2="575"/>
    <line x1="470" y1="30" x2="470" y2="575"/>
    <line x1="570" y1="30" x2="570" y2="575"/>
  </g>

  <!-- Outer Blueprint Frame -->
  <rect x="18" y="16" width="664" height="568" fill="none" stroke="#3c181a" stroke-width="1" stroke-dasharray="8 4" opacity="0.55"/>

  <!-- Subtle Zone Enclosures (Floorplan Wings) -->
  <rect x="44" y="48" width="564" height="86" rx="4" fill="#180a0b" fill-opacity="0.32" stroke="#42181a" stroke-width="0.9" stroke-dasharray="4 3"/>
  <rect x="524" y="156" width="142" height="332" rx="4" fill="#14090b" fill-opacity="0.34" stroke="#4a1a1c" stroke-width="0.9" stroke-dasharray="4 3"/>
  <rect x="42" y="366" width="352" height="222" rx="4" fill="#120c18" fill-opacity="0.35" stroke="#3e274f" stroke-width="0.9" stroke-dasharray="4 3"/>
  <rect x="442" y="502" width="194" height="76" rx="4" fill="#1a0709" fill-opacity="0.4" stroke="#7c1d1d" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Subtle Crimson Roman Numeral Watermarks -->
  <g font-family="Georgia, serif" font-weight="bold" fill="#7a1515" opacity="0.16" text-anchor="middle">
    <text x="230" y="325" font-size="42">IX</text>
    <text x="580" y="340" font-size="40">VIII</text>
    <text x="410" y="455" font-size="38">VII</text>
    <text x="235" y="495" font-size="38">VI</text>
    <text x="535" y="556" font-size="44">0</text>
  </g>

