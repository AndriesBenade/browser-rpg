<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860">
  <defs>
    <radialGradient id="al-void" cx="92%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1d1136"/>
      <stop offset="55%" stop-color="#100b1d"/>
      <stop offset="100%" stop-color="#080610"/>
    </radialGradient>
    <linearGradient id="al-river" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1824"/>
      <stop offset="65%" stop-color="#142938"/>
      <stop offset="100%" stop-color="#1c3947"/>
    </linearGradient>
    <linearGradient id="al-city" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291f3b"/>
      <stop offset="55%" stop-color="#211930"/>
      <stop offset="100%" stop-color="#1b1526"/>
    </linearGradient>
    <linearGradient id="al-salt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c263b"/>
      <stop offset="60%" stop-color="#242032"/>
      <stop offset="100%" stop-color="#1c1829"/>
    </linearGradient>
    <linearGradient id="al-ossuary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b2436"/>
      <stop offset="100%" stop-color="#211833"/>
    </linearGradient>
    <filter id="al-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Threshold Twilight & Far-East Abyss Backdrop -->
  <rect x="0" y="0" width="1440" height="860" fill="url(#al-void)"/>

  <!-- Swirling Threshold Abyss Currents on Far East (x: 1180..1440) -->
  <g fill="none" stroke="#6c43ab" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
    <path d="M 1295 160 C 1355 210 1345 310 1395 365"/>
    <path d="M 1330 290 C 1385 350 1365 445 1418 515"/>
    <path d="M 1320 560 C 1370 615 1345 705 1398 765"/>
    <path d="M 1255 725 C 1305 758 1348 795 1390 825"/>
  </g>
  <!-- Subtle spectral stars in the Abyss -->
  <g fill="#d6b4ff" opacity="0.55">
    <circle cx="1372" cy="185" r="1.8"/><circle cx="1408" cy="242" r="1.4"/><circle cx="1360" cy="422" r="2"/>
    <circle cx="1402" cy="576" r="1.6"/><circle cx="1352" cy="688" r="1.8"/><circle cx="1388" cy="790" r="1.3"/>
  </g>

  <!-- Western Black Mist-Weir River (x: 0..170) -->
  <path d="M 0 0 L 185 0 C 175 110 142 195 152 295 C 160 375 128 450 142 545 C 154 630 135 735 165 860 L 0 860 Z"
        fill="url(#al-river)"/>
  <!-- Mist-Weir current ripples -->
  <g fill="none" stroke="#488996" stroke-width="1.3" stroke-linecap="round" opacity="0.45">
    <path d="M 42 140 Q 62 215 44 295"/>
    <path d="M 78 265 Q 98 360 76 455"/>
    <path d="M 38 430 Q 60 520 42 615"/>
    <path d="M 82 585 Q 102 680 84 775"/>
  </g>

  <!-- WEST HALF: Vesper-Threshold Industrial City & Ash-Fields (x: 135..802) -->
  <path d="M 178 65 L 798 76 L 798 796 C 655 818 465 824 315 802 C 218 788 156 734 148 648 C 140 555 156 468 142 385 C 128 302 152 215 164 135 C 168 104 170 82 178 65 Z"
        fill="url(#al-city)" stroke="#8e6ec4" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Drawn Timber Docks jutting into the Mist-Weir at Weir-Port (100..215, 330..665) -->
  <g stroke="#8e78b0" stroke-width="3" stroke-linecap="round" opacity="0.72">
    <line x1="92" y1="360" x2="152" y2="360"/>
    <line x1="108" y1="480" x2="168" y2="480"/>
    <line x1="122" y1="648" x2="168" y2="648"/>
    <line x1="158" y1="340" x2="215" y2="340"/>
  </g>

  <!-- Gilded Terraces Elevated Escarpment (North-Central: 295..705, 95..325) -->
  <path d="M 302 124 C 405 92 582 102 678 164 C 712 198 708 286 656 322 C 562 338 425 322 332 276 C 282 246 276 154 302 124 Z"
        fill="#34264f" stroke="#a67be0" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.78"/>
  <path d="M 332 146 C 425 122 562 128 638 178 C 664 202 658 264 622 290 C 546 304 432 292 354 252 C 316 228 312 168 332 146 Z"
        fill="none" stroke="#c8a8f5" stroke-width="0.9" opacity="0.38"/>

  <!-- Chancery Brass-Works Industrial Grid & Sluice Canal (255..590, 295..705) -->
  <g stroke="#59417d" stroke-width="1.2" opacity="0.45">
    <rect x="382" y="294" width="60" height="36" fill="none"/>
    <rect x="404" y="418" width="58" height="44" fill="none"/>
    <rect x="514" y="362" width="54" height="36" fill="none"/>
    <circle cx="420" cy="580" r="24" fill="none" stroke="#7d64a8" stroke-dasharray="4 3"/>
  </g>
  <!-- Under-Sluice drainage canal from Foundries to Mist-Weir -->
  <path d="M 430 456 Q 365 555 290 680 Q 225 712 148 700" fill="none" stroke="#316170" stroke-width="4" opacity="0.6"/>

  <!-- Ash-Fields & Great Ash-Quarry Terraced Pits (South-Central: 445..760, 420..765) -->
  <g fill="none" stroke="#a67a8e" stroke-width="1.8" opacity="0.82">
    <ellipse cx="585" cy="525" rx="92" ry="56"/>
    <ellipse cx="585" cy="525" rx="62" ry="36"/>
    <ellipse cx="585" cy="525" rx="34" ry="18"/>
  </g>
  <!-- Warm Amber-Vein Catacombs & Smoking Kilns Fissure Glow -->
  <path d="M 658 432 Q 685 452 706 436 M 608 672 Q 642 692 678 668" fill="none" stroke="#e59a56" stroke-width="2.8" stroke-linecap="round" opacity="0.78"/>
  <!-- Rusted Viaduct Arches crossing east at (720, 600) -->
  <path d="M 664 600 H 804" stroke="#a990ba" stroke-width="3.4" stroke-dasharray="8 4" opacity="0.82"/>

  <!-- EAST HALF: The Pale Reach & Ossuary Bastions (x: 804..1345) -->
  <path d="M 804 96 C 925 90 1075 112 1195 182 C 1272 228 1282 296 1254 366 C 1236 410 1288 468 1344 514 C 1362 530 1338 564 1286 584 C 1244 600 1252 668 1212 712 C 1152 778 1022 798 905 782 C 845 774 820 756 804 745 Z"
        fill="url(#al-salt)" stroke="#9281bd" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- THE LANTERN-WALL (Great Fortified Dividing Line along x=800!) -->
  <line x1="800" y1="78" x2="800" y2="795" stroke="#181226" stroke-width="14"/>
  <line x1="800" y1="78" x2="800" y2="795" stroke="#9976cc" stroke-width="4" stroke-dasharray="18 6"/>
  <!-- Glowing Lantern-Wall watch-beacons -->
  <g fill="#5ce6d8" opacity="0.82">
    <circle cx="800" cy="160" r="4"/><circle cx="800" cy="290" r="4"/>
    <circle cx="800" cy="420" r="6"/><circle cx="800" cy="560" r="4"/><circle cx="800" cy="690" r="4"/>
  </g>

  <!-- Cracked Salt-Flat Polygon Lines across Pale Reach (845..1040, 290..590) -->
  <g fill="none" stroke="#6d688a" stroke-width="1" opacity="0.45">
    <path d="M 855 340 L 905 322 L 955 352 L 995 330 L 1030 365"/>
    <path d="M 905 322 L 922 390 L 968 424 L 944 486 L 892 502"/>
    <path d="M 862 465 L 912 455 L 952 528 L 998 508"/>
    <path d="M 968 424 L 1022 446"/>
  </g>

  <!-- Shattered Glass Steppe & Salt-Observatory Spires (920..1110, 165..270) -->
  <g fill="#362c54" stroke="#9e82d9" stroke-width="1.5" stroke-linejoin="round" opacity="0.88">
    <path d="M 926 232 L 960 172 L 994 232"/>
    <path d="M 1002 246 L 1040 176 L 1078 246"/>
    <path d="M 1052 252 L 1084 202 L 1112 252"/>
  </g>
  <!-- Star-dome halo at Salt-Observatory (960, 210) -->
  <circle cx="960" cy="210" r="18" fill="none" stroke="#5ce6d8" stroke-width="1" stroke-dasharray="3 4" opacity="0.65"/>

  <!-- Whispering Mire Marshes (825..955, 645..760) -->
  <path d="M 822 668 C 858 636 938 644 958 688 C 972 722 932 764 872 762 C 832 760 808 712 822 668 Z"
        fill="#162930" stroke="#458285" stroke-width="1.4" opacity="0.88"/>
  <g stroke="#5eb0a8" stroke-width="1.2" stroke-linecap="round" opacity="0.72">
    <path d="M 852 688 v -10 M 857 690 v -12 M 894 714 v -9 M 899 716 v -11 M 922 682 v -9"/>
  </g>

  <!-- Ossuary Bastions Bone-Stone Crags & Marrow Chasm (1035..1245, 340..765) -->
  <path d="M 1055 340 C 1125 322 1218 355 1244 432 C 1260 492 1242 588 1192 636 C 1138 688 1066 655 1046 575 C 1028 498 1018 368 1055 340 Z"
        fill="url(#al-ossuary)" stroke="#8b7ba8" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.78"/>
  <!-- Chasm line & Marrow-Stone Bridge at (1060, 560) -->
  <path d="M 1058 485 Q 1068 545 1042 622" fill="none" stroke="#0c0817" stroke-width="7"/>
  <path d="M 1042 560 H 1084" stroke="#cfc2e6" stroke-width="3.5" opacity="0.85"/>
  <!-- Weeping Glass Orchard amber trees at (1030, 740) -->
  <g fill="#422a36" stroke="#d99a5b" stroke-width="1.2" opacity="0.82">
    <circle cx="1008" cy="732" r="7"/><circle cx="1028" cy="724" r="8"/><circle cx="1050" cy="734" r="7"/><circle cx="1032" cy="752" r="6"/>
  </g>

  <!-- Glowing First Seal Sanctum Causeway (1245..1345, 495..545) -->
  <circle cx="1320" cy="520" r="26" fill="#a970ff" opacity="0.22" filter="url(#al-glow)"/>
  <circle cx="1320" cy="520" r="20" fill="none" stroke="#d6b4ff" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.75"/>

  <!-- Subtle Cartographic Region Labels -->
  <g font-family="'Cinzel', Georgia, serif" fill="#cbb6f0" opacity="0.68" text-anchor="middle">
    <text x="64" y="420" font-size="15" letter-spacing="5" fill="#6cc8d1" transform="rotate(-90 64 420)">THE MIST-WEIR RIVER</text>
    <text x="485" y="136" font-size="15" letter-spacing="5">GILDED TERRACES</text>
    <text x="455" y="380" font-size="14" letter-spacing="4">CHANCERY BRASS-WORKS</text>
    <text x="585" y="608" font-size="14" letter-spacing="4" fill="#d9a59a">ASH-FIELDS &amp; QUARRIES</text>
    <text x="778" y="265" font-size="14" letter-spacing="5" fill="#6ef2e4" transform="rotate(-90 778 265)">LANTERN-WALL</text>
    <text x="942" y="446" font-size="16" letter-spacing="5">THE PALE REACH</text>
    <text x="1142" y="486" font-size="15" letter-spacing="4">OSSUARY BASTIONS</text>
    <text x="1352" y="385" font-size="14" letter-spacing="4" fill="#b48cf5" font-style="italic">Threshold Abyss</text>
  </g>

  <!-- Spectral Threshold Compass Rose (bottom-left river/void corner) -->
  <g transform="translate(74, 782)" opacity="0.7">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#8a68bd" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="19" fill="none" stroke="#458285" stroke-width="0.8" stroke-dasharray="3 3"/>
    <polygon points="0,-30 5,-5 0,-10 -5,-5" fill="#d6b4ff"/>
    <polygon points="0,30 5,5 0,10 -5,5" fill="#5a3f87"/>
    <polygon points="-30,0 -5,-5 -10,0 -5,5" fill="#5a3f87"/>
    <polygon points="30,0 5,-5 10,0 5,5" fill="#5ce6d8"/>
    <text x="0" y="-34" text-anchor="middle" fill="#d6b4ff" font-family="'Cinzel', serif" font-size="10">N</text>
  </g>
</svg>
